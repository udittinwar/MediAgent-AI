name: Database Tests

on:
  push:
    branches:
      - feature/vishvesh-database

  pull_request:
    branches:
      - main

jobs:
  database-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mediagent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run database migration
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d mediagent \
            -f migrations/001_initial_schema.sql

      - name: Run database tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mediagent
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python test_db.py